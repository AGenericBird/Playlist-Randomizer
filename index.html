<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8">
        <title>Playlist Randomizer</title>
        <link rel="stylesheet" href="main_decor.css">
    </head>
    <body>
        <header>
            <h1>True Playlist Randomizer</h1>
            <p>Shuffle large YouTube playlists properly.</p>
        </header>
        <main>
            <div class="input-group">
                <input type="text" id="playlist-url" placeholder="Paste YouTube Playlist URL here">
                <button onclick="loadAndShuffle()">Shuffle & Play</button>
            </div>

            <div id="player-container">
                <div id="player"></div>
            </div>

            <div id="player-controls" style="display: none;">
                <button onclick="reshufflePlaylist()">🔀 Reshuffle Playlist</button>
                <button id="repeat-btn" onclick="toggleRepeat()">🔁 Repeat: OFF</button>
            </div>

            <div id="upcoming-container" style="display: none;">
                <h3>Upcoming Tracks</h3>
                <ul id="upcoming-list"></ul>
            </div>
        </main>
        <p>Copyright&copy; Dawn Laprise</p>

        <script src="https://www.youtube.com/iframe_api"></script>
        <script src="app.js"></script>
    </body>
</html>
